- name: Desplegar Agente APM a Windows
  hosts: all  # Cambiado 'all' por un grupo específico (recomendado)
  vars:
    destino_windows: 'C:\Tools\agente-apm'
    # Asegúrate de que esta ruta exista en tu nodo de control (Linux)
    archivo_origen: 'opentelemetry-javaagent.jar' 

  tasks:
    - name: 1. Crear directorio de destino en Windows
      ansible.windows.win_file:
        path: "{{ destino_windows }}"
        state: directory

    - name: 2. Copiar agente APM
      ansible.windows.win_copy:
        src: "{{ archivo_origen }}"
        dest: "{{ destino_windows }}\opentelemetry-javaagent.jar"
        force: yes
      register: copy_result

    - name: 3. Mostrar resultado
      ansible.builtin.debug:
        var: copy_result
