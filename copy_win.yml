---
- name: Copiar Agente
  hosts: all
  gather_facts: no
  vars:
    archivo_fuente: "opentelemetry-javaagent.jar"
    destino_windows: 'C:\Tools\agente-apm'

  tasks:
    - name: Crear carpeta de herramientas si no existe
      win_file:
        path: "{{ destino_windows }}"
        state: directory

    - name: Copiar el agente APM a la carpeta Tools
      win_copy:
        src: "{{ archivo_fuente }}"
        dest: "{{ destino_windows }}\\opentelemetry-javaagent.jar"

    - name: Verificar que el archivo existe en el destino
      win_stat:
        path: "{{ destino_windows }}\\opentelemetry-javaagent.jar"
      register: jar_stat

    - name: Validar resultado de la copia
      fail:
        msg: "Error: El archivo no se copió correctamente o no existe."
      when: not jar_stat.stat.exists

    - name: Mostrar detalles del archivo copiado
      debug:
        msg: 
          - "Archivo: {{ jar_stat.stat.filename }}"
          - "Tamaño: {{ jar_stat.stat.size }} bytes"
          - "Ruta: {{ jar_stat.stat.path }}"
      when: jar_stat.stat.exists
